<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light; --paper: #f7f7f3; --ink: #232323; --signal: #a1ffcb; --line: rgba(35,35,35,.72); }
      :root[data-theme="dark"] { color-scheme: dark; --paper: #181918; --ink: #f1f1eb; --signal: #78dba7; --line: rgba(241,241,235,.68); }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.25 "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .not-found { position: relative; display: grid; min-height: 100svh; align-content: center; gap: 1.4rem; padding: clamp(2rem, 8vw, 8rem); overflow: hidden; }
      .halftone { position: absolute; inset: 0; opacity: .18; background-image: radial-gradient(circle, var(--ink) 0 .8px, transparent 1px); background-size: 6px 6px; mask-image: linear-gradient(135deg, #000, transparent 60%); }
      .utility-text { position: relative; margin: 0; font: .68rem/1.4 monospace; letter-spacing: .08em; text-transform: uppercase; }
      h1 { position: relative; max-width: 9ch; margin: 0; font-size: clamp(4rem, 11vw, 10rem); font-weight: 430; letter-spacing: -.09em; line-height: .8; }
      a { position: relative; width: fit-content; padding: .8rem 1rem; background: var(--signal); color: var(--ink); text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    </style>
    <title>Not found — Jean-Luc Peloquin</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("jl-theme") || "light";
      } catch (_) {}
    </script>
  </head>
  <body>
    <main class="not-found">
      <div class="halftone" aria-hidden="true"></div>
      <p class="utility-text">Signal lost / 404</p>
      <h1>This route<br />is out of range.</h1>
      <a href="/">Return to the portfolio <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
