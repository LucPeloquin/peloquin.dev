<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">Automatic Music Transcription — illustrative team-project pipeline</title>
<desc id="desc">A conceptual diagram showing audio input, MT3 processing, MIDI, ScoreTransformer, and MusicXML notation. JUCE provides the interface for file selection and output. Team project, December 2023.</desc>
